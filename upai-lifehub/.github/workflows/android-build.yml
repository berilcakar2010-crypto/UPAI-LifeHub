name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release AAB for Play Store"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build
        env:
          CI: false

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest permissions
        run: node scripts/patch-android.js

      - name: Install app icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0f1814' \
            --iconBackgroundColorDark '#0f1814' \
            --splashBackgroundColor '#0f1814' \
            --splashBackgroundColorDark '#0f1814' \
            --assetPath android-resources || echo "asset generation skipped"

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      # ── Debug APK: always built, installable directly on your phone ──
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: upai-lifehub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release build: needs signing secrets ──
      - name: Decode keystore
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. See README for how to create it."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upai-release.keystore
          echo "Keystore written."

      - name: Configure signing
        if: ${{ github.event.inputs.release == 'true' }}
        run: |
          cat >> android/app/build.gradle << 'EOG'

          android {
              signingConfigs {
                  release {
                      storeFile file('upai-release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOG

      - name: Build signed release AAB + APK
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload release bundle
        if: ${{ github.event.inputs.release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: upai-lifehub-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
